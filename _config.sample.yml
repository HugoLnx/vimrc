# Copy this file to config.yml (install.sh/install.ps1 do this for you
# automatically if config.yml does not exist yet).
#
# The enforcer uses only the home entry matching the OS it currently runs on:
# linux (including WSL), mac, or windows. Other entries are ignored. If no
# entry matches, the current user's home (~) is used.
#
# Optional per-home field: `skip` is a list of labels/groups to leave out of
# a default run (one with no labels on the command line). For example:
#   skip: [vim-plugins, agentic]
# Explicit CLI labels always win, so `./install/install.sh agentic` still
# runs the agentic labels when this list includes `agentic`.
#
# Optional per-home field: `unity_yaml_merge` is the full path to
# UnityYAMLMerge (under an installed Unity Editor's Editor/Data/Tools/). It
# adds a [mergetool "unityyamlmerge"] block to this home's .gitconfig.
#
# Deprecated per-home fields: `only_vim: true` is treated as `skip: [git,
# agentic]`; `agentic: false` is treated as `skip: [agentic]`. Migrate to
# `skip`; these compatibility fields will be removed later.
#
# Optional top-level field: `csharp_lsp: false` disables csharp_ls integration
# in Neovim. It defaults to true and controls generated nvim/lua/user/local.lua.

homes:
  - os: linux
    path: "~"

# A multi-OS config can be committed locally, but each run affects only its
# own OS. Run install/install.ps1 on Windows rather than syncing a Windows
# home through WSL.
# homes:
#   - os: linux
#     path: /home/you
#   - os: windows
#     path: "~"
#     unity_yaml_merge: 'C:\Program Files\Unity\Hub\Editor\6000.0.17f1\Editor\Data\Tools\UnityYAMLMerge.exe'
#     skip: [nvim-plugins]

# csharp_lsp: false
